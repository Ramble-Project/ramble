recipes:
  scaling_study:
    title: "Configuring a Scaling Study"
    mode: "selectable"
    default_app: "wrf"
    apps:
      wrf:
        name: "WRF"
        workload: "CONUS_12km"
        description: "Weather Research and Forecasting atmospheric model"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create scaling_wrf"
            in_commands_sh: false
          - cmd: ["config", "add", "variables:processes_per_node:16"]
          - cmd: ["config", "add", 'variables:n_ranks:"{processes_per_node}*{n_nodes}"']
          - cmd: ["config", "add", "variables:mpi_command:mpirun -n {n_ranks}"]
          - cmd: ["config", "add", 'variables:batch_submit:"{execute_experiment}"']
          - cmd: ["workspace", "manage", "experiments", "wrf", "--workload-filter", "CONUS_12km", "-e", "scaling_{n_nodes}", "-V", "package_manager=spack", "-v", "n_nodes=[1, 2]"]
            display: "$ ramble workspace manage experiments wrf --workload-filter CONUS_12km -e 'scaling_{n_nodes}' -V package_manager=spack -v 'n_nodes=[1, 2]'"
          - cmd: ["workspace", "concretize"]
            display: "$ ramble workspace concretize"
      gromacs:
        name: "GROMACS"
        workload: "water_bare"
        description: "Molecular dynamics simulation package"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create scaling_gromacs"
            in_commands_sh: false
          - cmd: ["config", "add", "variables:processes_per_node:16"]
          - cmd: ["config", "add", 'variables:n_ranks:"{processes_per_node}*{n_nodes}"']
          - cmd: ["config", "add", "variables:mpi_command:mpirun -n {n_ranks}"]
          - cmd: ["config", "add", 'variables:batch_submit:"{execute_experiment}"']
          - cmd: ["workspace", "manage", "experiments", "gromacs", "--workload-filter", "water_bare", "-e", "scaling_{n_nodes}", "-V", "package_manager=spack", "-v", "n_nodes=[1, 2]"]
            display: "$ ramble workspace manage experiments gromacs --workload-filter water_bare -e 'scaling_{n_nodes}' -V package_manager=spack -v 'n_nodes=[1, 2]'"
          - cmd: ["workspace", "concretize"]
            display: "$ ramble workspace concretize"
      hpl:
        name: "HPL"
        workload: "calculator"
        description: "High-Performance Linpack benchmark"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create scaling_hpl"
            in_commands_sh: false
          - cmd: ["config", "add", "variables:processes_per_node:16"]
          - cmd: ["config", "add", 'variables:n_ranks:"{processes_per_node}*{n_nodes}"']
          - cmd: ["config", "add", "variables:mpi_command:mpirun -n {n_ranks}"]
          - cmd: ["config", "add", 'variables:batch_submit:"{execute_experiment}"']
          - cmd: ["workspace", "manage", "experiments", "hpl", "--workload-filter", "calculator", "-e", "scaling_{n_nodes}", "-V", "package_manager=spack", "-v", "n_nodes=[1, 2]", "-v", "memory_per_node=8"]
            display: "$ ramble workspace manage experiments hpl --workload-filter calculator -e 'scaling_{n_nodes}' -V package_manager=spack -v 'n_nodes=[1, 2]' -v memory_per_node=8"
          - cmd: ["workspace", "concretize"]
            display: "$ ramble workspace concretize"


