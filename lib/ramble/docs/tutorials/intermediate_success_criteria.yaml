recipes:
  success_criteria:
    title: "Success Criteria"
    mode: "selectable"
    default_app: "wrf"
    apps:
      wrf:
        name: "WRF"
        workload: "CONUS_12km"
        description: "Weather Research and Forecasting atmospheric model"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create success_wrf"
            in_commands_sh: false
          - display: "$ ramble workspace activate success_wrf"
          - display: "$ ramble workspace edit"
        snippets:
          base: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
          regex_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                wrf@4.2:
                  success_criteria:
                  - name: timing-present
                    mode: string
                    match: Timing for main.*
                    file: '{experiment_run_dir}/rsl.out.base'
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
          fom_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                wrf@4.2:
                  success_criteria:
                  - name: timing-present
                    mode: string
                    match: Timing for main.*
                    file: '{experiment_run_dir}/rsl.out.base'
                  workloads:
                    CONUS_12km:
                      success_criteria:
                      - name: correct-timesteps
                        mode: fom_comparison
                        fom_name: Number of timesteps
                        formula: '{value} >= 50'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
          final: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                wrf@4.2:
                  success_criteria:
                  - name: timing-present
                    mode: string
                    match: Timing for main.*
                    file: '{experiment_run_dir}/rsl.out.base'
                  workloads:
                    CONUS_12km:
                      success_criteria:
                      - name: correct-timesteps
                        mode: fom_comparison
                        fom_name: Number of timesteps
                        formula: '{value} >= 50'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
      gromacs:
        name: "GROMACS"
        workload: "water_bare"
        description: "Molecular dynamics simulation package"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create success_gromacs"
            in_commands_sh: false
          - display: "$ ramble workspace activate success_gromacs"
          - display: "$ ramble workspace edit"
        snippets:
          base: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                gromacs@2025.3:
                  workloads:
                    water_bare:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  gromacs:
                    pkg_spec: gromacs@{application::gromacs::version}
                    compiler: gcc14
                environments:
                  gromacs@2025.3:
                    packages:
                    - intel-mpi
                    - gromacs
          regex_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                gromacs@2025.3:
                  success_criteria:
                  - name: mdrun-finished
                    mode: string
                    match: Finished mdrun.*
                    file: '{experiment_run_dir}/md.log'
                  workloads:
                    water_bare:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  gromacs:
                    pkg_spec: gromacs@{application::gromacs::version}
                    compiler: gcc14
                environments:
                  gromacs@2025.3:
                    packages:
                    - intel-mpi
                    - gromacs
          fom_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                gromacs@2025.3:
                  success_criteria:
                  - name: mdrun-finished
                    mode: string
                    match: Finished mdrun.*
                    file: '{experiment_run_dir}/md.log'
                  workloads:
                    water_bare:
                      success_criteria:
                      - name: max-walltime
                        mode: fom_comparison
                        fom_name: Wall Time
                        formula: '{value} <= 300'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  gromacs:
                    pkg_spec: gromacs@{application::gromacs::version}
                    compiler: gcc14
                environments:
                  gromacs@2025.3:
                    packages:
                    - intel-mpi
                    - gromacs
          final: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                gromacs@2025.3:
                  success_criteria:
                  - name: mdrun-finished
                    mode: string
                    match: Finished mdrun.*
                    file: '{experiment_run_dir}/md.log'
                  workloads:
                    water_bare:
                      success_criteria:
                      - name: max-walltime
                        mode: fom_comparison
                        fom_name: Wall Time
                        formula: '{value} <= 300'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  gromacs:
                    pkg_spec: gromacs@{application::gromacs::version}
                    compiler: gcc14
                environments:
                  gromacs@2025.3:
                    packages:
                    - intel-mpi
                    - gromacs
      hpl:
        name: "HPL"
        workload: "calculator"
        description: "High-Performance Linpack benchmark"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create success_hpl"
            in_commands_sh: false
          - display: "$ ramble workspace activate success_hpl"
          - display: "$ ramble workspace edit"
        snippets:
          base: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                hpl@2.3:
                  workloads:
                    calculator:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
                            memory_per_node: 8
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  hpl:
                    pkg_spec: hpl@{application::hpl::version} +openmp
                    compiler: gcc14
                environments:
                  hpl@2.3:
                    packages:
                    - intel-mpi
                    - hpl
          regex_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                hpl@2.3:
                  success_criteria:
                  - name: passed
                    mode: string
                    match: '.*PASSED.*'
                    file: '{experiment_run_dir}/HPL.out'
                  workloads:
                    calculator:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
                            memory_per_node: 8
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  hpl:
                    pkg_spec: hpl@{application::hpl::version} +openmp
                    compiler: gcc14
                environments:
                  hpl@2.3:
                    packages:
                    - intel-mpi
                    - hpl
          fom_criteria: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                hpl@2.3:
                  success_criteria:
                  - name: passed
                    mode: string
                    match: '.*PASSED.*'
                    file: '{experiment_run_dir}/HPL.out'
                  workloads:
                    calculator:
                      success_criteria:
                      - name: min-gflops
                        mode: fom_comparison
                        fom_name: GFlops
                        formula: '{value} >= 1.0'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
                            memory_per_node: 8
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  hpl:
                    pkg_spec: hpl@{application::hpl::version} +openmp
                    compiler: gcc14
                environments:
                  hpl@2.3:
                    packages:
                    - intel-mpi
                    - hpl
          final: |
            ramble:
              variants:
                package_manager: spack
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                hpl@2.3:
                  success_criteria:
                  - name: passed
                    mode: string
                    match: '.*PASSED.*'
                    file: '{experiment_run_dir}/HPL.out'
                  workloads:
                    calculator:
                      success_criteria:
                      - name: min-gflops
                        mode: fom_comparison
                        fom_name: GFlops
                        formula: '{value} >= 1.0'
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
                            memory_per_node: 8
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  hpl:
                    pkg_spec: hpl@{application::hpl::version} +openmp
                    compiler: gcc14
                environments:
                  hpl@2.3:
                    packages:
                    - intel-mpi
                    - hpl

