recipes:
  using_modifiers:
    title: "Modifiers"
    mode: "selectable"
    default_app: "wrf"
    apps:
      wrf:
        name: "WRF"
        workload: "CONUS_12km"
        description: "Weather Research and Forecasting atmospheric model"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create modifiers_wrf"
            in_commands_sh: false
          - display: "$ ramble workspace activate modifiers_wrf"
          - display: "$ ramble workspace edit"
        snippets:
          base: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}:
                          variables:
                            n_nodes: [1, 2]
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
          lscpu: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                processes_per_node: 16
                n_ranks: '{processes_per_node}*{n_nodes}'
