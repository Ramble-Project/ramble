recipes:
  var_expansion:
    title: "Variable Expansion, Indirection, and Software Stack Parameterization"
    mode: "selectable"
    default_app: "wrf"
    apps:
      wrf:
        name: "WRF"
        workload: "CONUS_12km"
        description: "Weather Research and Forecasting atmospheric model"
        commands:
          - cmd: ["workspace", "create", "-d", "{ws}"]
            display: "$ ramble workspace create var_expansion_wrf"
            in_commands_sh: false
          - display: "$ ramble workspace activate var_expansion_wrf"
          - display: "$ ramble workspace edit"
        snippets:
          base: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
                platform: [platform1, platform2]
                processes_per_node: [16, 18]
              zips:
                platform_config:
                - platform
                - processes_per_node
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}_{platform}:
                          variables:
                            n_nodes: [1, 2]
                          matrix:
                          - platform_config
                          - n_nodes
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2:
                    packages:
                    - intel-mpi
                    - wrfv4-{application::wrf::version}
          mpi: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
                platform: [platform1, platform2]
                processes_per_node: [16, 18]
                mpi_name: [intel-mpi, openmpi]
              zips:
                platform_config:
                - platform
                - processes_per_node
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}_{platform}:
                          variables:
                            n_nodes: [1, 2]
                          matrix:
                          - platform_config
                          - n_nodes
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  openmpi:
                    pkg_spec: openmpi@5.0.8
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2-{mpi_name}:
                    packages:
                    - '{mpi_name}'
                    - wrfv4-{application::wrf::version}
          mpi_matrix: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                n_ranks: '{processes_per_node}*{n_nodes}'
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun -n {n_ranks}
                platform: [platform1, platform2]
                processes_per_node: [16, 18]
                mpi_name: ['intel-mpi', 'openmpi']
              zips:
                platform_config:
                - platform
                - processes_per_node
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}_{platform}_{mpi_name}:
                          variables:
                            n_nodes: [1, 2]
                            env_name: 'wrf@4.2-{mpi_name}'
                          matrix:
                          - platform_config
                          - n_nodes
                          - mpi_name
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  openmpi:
                    pkg_spec: openmpi@5.0.8
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2-{mpi_name}:
                    packages:
                    - '{mpi_name}'
                    - wrfv4-{application::wrf::version}
          expansion_indirection: |
            ramble:
              variants:
                package_manager: spack
              env_vars:
                set:
                  OMP_NUM_THREADS: '{n_threads}'
              variables:
                n_ranks: '{processes_per_node}*{n_nodes}'
                platform: [platform1, platform2]
                processes_per_node: [16, 18]

                # Execution Template
                batch_submit: '{execute_experiment}'
                mpi_command: mpirun {{mpi_name}_args}

                # Experiment Expansions
                mpi_name: [intel-mpi, openmpi]
                intel-mpi_args: -n {n_ranks} -ppn {processes_per_node}
                openmpi_args: --np {n_ranks} --map-by ppr:{processes_per_node}:node -x OMP_NUM_THREADS
              zips:
                platform_config:
                - platform
                - processes_per_node
              applications:
                wrf@4.2:
                  workloads:
                    CONUS_12km:
                      experiments:
                        scaling_{n_nodes}_{platform}_{mpi_name}:
                          variables:
                            n_nodes: [1, 2]
                            env_name: 'wrf@4.2-{mpi_name}'
                          matrix:
                          - platform_config
                          - n_nodes
                          - mpi_name
              software:
                packages:
                  gcc14:
                    pkg_spec: gcc@14.2.0
                  intel-mpi:
                    pkg_spec: intel-oneapi-mpi@2021.17.2
                    compiler: gcc14
                  openmpi:
                    pkg_spec: openmpi@5.0.8
                    compiler: gcc14
                  wrfv4-{application::wrf::version}:
                    pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
                      nesting=basic ~pnetcdf
                    compiler: gcc14
                environments:
                  wrf@4.2-{mpi_name}:
                    packages:
                    - '{mpi_name}'
                    - wrfv4-{application::wrf::version}
          final: |
