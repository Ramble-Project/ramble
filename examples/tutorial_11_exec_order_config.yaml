ramble:
  variants:
    package_manager: spack
  env_vars:
    set:
      OMP_NUM_THREADS: '{n_threads}'
  variables:
    processes_per_node: 16
    n_ranks: '{processes_per_node}*{n_nodes}'
    batch_submit: '{execute_experiment}'
    mpi_command: mpirun -n {n_ranks}
  applications:
    wrf@4.2:
      workloads:
        CONUS_12km:
          experiments:
            scaling_{n_nodes}:
              internals:
                custom_executables:
                  start_time:
                    template:
                    - date +%s
                    redirect: '{experiment_run_dir}/start_time'
                    use_mpi: false
                  end_time:
                    template:
                    - date +%s
                    redirect: '{experiment_run_dir}/end_time'
                    use_mpi: false
                executables:
                - builtin::env_vars
                - package_manager_builtin::spack::spack_source
                - package_manager_builtin::spack::spack_activate
                - stage-files
                - stage-namelist
                - cleanup
                - define_nproc_y
                - define_nproc_x
                - fix_12km_start_hour
                - fix_12km_restart
                - start_time
                - execute
                - end_time
                - copy-logs
                - post-exec-clean
              variables:
                n_nodes: [1, 2]
  software:
    packages:
      gcc14:
        pkg_spec: gcc@14.2.0
      intel-mpi:
        pkg_spec: intel-oneapi-mpi@2021.17.2
        compiler: gcc14
      wrfv4-{application::wrf::version}:
        pkg_spec: wrf@{application::wrf::version} build_type=dm+sm compile_type=em_real
          nesting=basic ~pnetcdf
        compiler: gcc14
    environments:
      wrf@4.2:
        packages:
        - intel-mpi
        - wrfv4-{application::wrf::version}
