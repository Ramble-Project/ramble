tags:
  # This is used for filtering builds related to a specific PR
  - '$TRIGGER_NAME-$_PR_NUMBER'
steps:
  # Cancel older builds
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
      - 'LOCATION=$LOCATION'
  - name: us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-docs:latest
    args:
      - '-c'
      - |
        set -e
        if cmp -s /workspace/requirements.txt /opt/ramble/requirements.txt && \
           cmp -s /workspace/lib/ramble/docs/requirements.txt /opt/ramble/lib/ramble/docs/requirements.txt; then
          echo "Doc requirements match container image; skipping pip install."
        else
          python -m pip install --exists-action=w --no-cache-dir -r /workspace/lib/ramble/docs/requirements.txt
        fi

        export RAMBLE_PYTHON="$(which python3)"
        . /workspace/share/ramble/setup-env.sh

        cd /workspace/lib/ramble/docs

        mkdir -p test_docs/html
        python -m sphinx -T -W --keep-going -b html -d _build/doctrees -D language=en . test_docs/html
        rm -r test_docs
    id: ramble-docs-test
    entrypoint: /bin/bash
timeout: 600s
queueTtl: 7200s
