tags:
  # This is used for filtering builds related to a specific PR
  - '$TRIGGER_NAME-$_PR_NUMBER'
steps:
  # Cancel older builds
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
      - 'LOCATION=$LOCATION'
  - name: gcr.io/cloud-builders/git
    args:
      - fetch
      - '--unshallow'
    id: ramble-clone
  - name: us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG}-${_BASE_VER}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest
    args:
      - '-c'
      - |
        . /workspace/share/ramble/cloud-build/setup-ci-env.sh

        ramble style -a -U
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        style_err=$$?

        ramble commands --update-completion
        git diff --exit-code &> /dev/null
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        commands_err=$$?

        # Enforce up-to-date python syntax
        pre-commit run pyupgrade --all-files --verbose
        pyupgrade_err=$$?

        ramble license verify
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        license_err=$$?

        ramble help
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        missing_req_err=$$?

        error=0
        # Check to see if dependencies are present and simple command succeed
        if [ $$missing_req_err -gt 0 ]; then
          echo " ***** ramble help call failed. Perhaps a required package was not installed?"
          error=1
        fi

        # Test removing a dependency
        pip uninstall -y pytest

        ramble help
        missing_req_err=$$?

        # Check to see if dependencies are loaded lazily and simple commands can still succeed
        if [ $$missing_req_err -gt 0 ]; then
          echo " ***** ramble help call failed. Perhaps a required packed loaded too early?"
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$style_err -gt 0 ]; then
          echo "Style error = $$style_err"
          echo " ***** Style tests failed"
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$commands_err -gt 0 ]; then
          echo "Commands error = $$commands_err"
          echo " ***** Commands changed and bash completion is not updated."
          echo "       Please use the following to fix this:"
          echo "         ramble commands --update-completion"
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$license_err -gt 0 ]; then
          echo "License check error = $$license_err"
          echo " ***** License check failed"
          error=1
        fi

        if [ $$pyupgrade_err -gt 0 ]; then
          echo "pyupgrade check error = $$pyupgrade_err"
          echo " ***** pyupgrade check failed"
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        exit $$error
    id: ramble-style-tests
    entrypoint: /bin/bash
substitutions:
  _SPACK_REF: v0.21.2
  _PYTHON_VER: 3.11.6
  _BASE_IMG: rockylinux 
  _BASE_VER: '8'
timeout: 600s
queueTtl: 7200s
