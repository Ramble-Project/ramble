steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: builder
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-docs:latest'
      - '--cache-from'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-docs:latest'
      - '-f'
      - 'share/ramble/cloud-build/Dockerfile-docs'
      - '--build-arg'
      - 'PYTHON_VER=${_PYTHON_VER}'
      - '.'
substitutions:
  _PYTHON_VER: '3.12'
images: ['us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-docs:latest']
timeout: 1200s
queueTtl: 7200s
