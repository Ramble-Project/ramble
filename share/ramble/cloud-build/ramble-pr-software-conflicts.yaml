tags:
  # This is used for filtering builds related to a specific PR
  - '$TRIGGER_NAME-$_PR_NUMBER'
steps:
  # Cancel older builds
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
      - 'LOCATION=$LOCATION'
  - name: gcr.io/cloud-builders/git
    args:
      - fetch
      - '--unshallow'
    id: ramble-clone
  - name: us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG}-${_BASE_VER}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest
    args:
      - '-c'
      - |
        . /workspace/share/ramble/cloud-build/setup-ci-env.sh

        ramble software-definitions -s

        ramble software-definitions -c -e
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        conflict_err=$$?

        ramble python share/ramble/qa/check_configs.py
        configs_err=$$?

        error=0
        if [ $$conflict_err -gt 0 ]; then
          echo " ***** Conflicts in software definitions detected."
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$configs_err -gt 0 ]; then
          echo " ***** One or more workspace configurations failed validation."
          error=1
        fi

        exit $$error
    id: ramble-style-tests
    entrypoint: /bin/bash
substitutions:
  _SPACK_REF: v0.21.2
  _PYTHON_VER: 3.11.6
  _BASE_IMG: rockylinux
  _BASE_VER: '8'
timeout: 600s
queueTtl: 7200s
