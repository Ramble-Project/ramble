tags:
  # This is used for filtering builds related to a specific PR
  - '$TRIGGER_NAME-$_PR_NUMBER'
steps: 
  # Cancel older builds
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
      - 'LOCATION=$LOCATION'
  - name: gcr.io/cloud-builders/git
    args:
      - fetch
      - '--unshallow'
    id: ramble-clone
  - name: us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG}-${_BASE_VER}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest
    args:
      - '-c'
      - |
        cd /workspace

        git branch develop origin/develop

        . /opt/spack/share/spack/setup-env.sh

        spack load py-pip ^python

        pip install -r /workspace/requirements-pinned.txt

        export SPACK_PYTHON=`which python3`

        . /workspace/share/ramble/setup-env.sh

        echo "Spack version is $(spack --version)"
        echo "Python version is $(python3 --version)"

        UNIT_TEST_COVERAGE=true LONG=true /workspace/share/ramble/qa/run-unit-tests
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        unit_err=$$?

        coverage report -m --fail-under=77
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        coverage_err=$$?

        error=0
        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$unit_err -gt 0 ]; then
          echo "Unit error = $$unit_err"
          echo " ***** Unit tests failed"
          error=1
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        if [ $$coverage_err -gt 0 ]; then
          python3 -c 'import sys; exit(0 if sys.version_info >= (3, 9) else 1)'
          py_version_check_err=$$?
          if [ $$py_version_check_err -eq 0 ]; then
            if [ $$coverage_err == 2 ]; then
              echo "Code coverage dropped below the minimum level."
              echo " ***** Coverage decreased"
            else
              echo "Code coverage report generation failed."
              echo " ***** Coverage report generic error"
            fi

            error=1
          else
            echo "Skipping coverage check for python version < 3.9, as the coverage number is not accurate"
          fi
        fi

        # $$ characters are required for cloud-build:
        # https://cloud.google.com/build/docs/configuring-builds/substitute-variable-values
        exit $$error
    id: ramble-unit-tests
    entrypoint: /bin/bash
    env:
    - 'COMMIT_SHA=$_COMMIT_SHA'
    - 'CODECOV_TOKEN=$_CODECOV_TOKEN'
    - 'PUSH_CODECOV=$_PUSH_CODECOV'
    - 'BASE_BRANCH=$_BASE_BRANCH'
    - 'PR_NUMBER=$_PR_NUMBER'
substitutions:
  _SPACK_REF: v0.21.2
  _PYTHON_VER: 3.11.6
  _BASE_IMG: rockylinux
  _BASE_VER: '8'
  _WORKER_POOL: ''
timeout: 3600s
queueTtl: 7200s
options:
  pool:
    name: '$_WORKER_POOL'
