steps:
  # Cancel older builds (only for PR builds)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'share/ramble/cloud-build/cancel-older-builds.sh'
    env:
      - 'PR_NUMBER=$_PR_NUMBER'
      - 'TRIGGER_NAME=$TRIGGER_NAME'
      - 'BUILD_ID=$BUILD_ID'
      - 'PROJECT_ID=$PROJECT_ID'
      - 'LOCATION=$LOCATION'
  - name: gcr.io/cloud-builders/git
    args:
      - fetch
      - '--unshallow'
    id: ramble-clone
  - name: us-central1-docker.pkg.dev/$PROJECT_ID/ramble-repo/ramble-${_BASE_IMG}-${_BASE_VER}-spack${_SPACK_REF}-python${_PYTHON_VER}:latest
    args:
      - '-c'
      - |
        cd /workspace

        git branch develop origin/develop

        . /opt/spack/share/spack/setup-env.sh

        spack load py-pip ^python

        pip install -r /workspace/requirements-pinned.txt

        export SPACK_PYTHON=$(which python3)

        . /workspace/share/ramble/setup-env.sh

        echo "Spack version is $(spack --version)"
        echo "Python version is $(python3 --version)"

        echo "Running Perf Tests..."
        ramble unit-test --perf
        test_err=$$?

        if [ $$test_err -eq 0 ]; then
          echo "Perf tests passed."

          if [ -f "$$RAMBLE_ROOT/perf_test_metrics.json" ]; then
            echo "Generated Metrics:"
            cat "$$RAMBLE_ROOT/perf_test_metrics.json"
            echo ""
          fi

          if [ -z "$_PR_NUMBER" ] && [ "$_UPLOAD_TO_BQ" == "true" ]; then
            echo "Uploading metrics to BigQuery..."
            python3 share/ramble/qa/upload_perf_metrics.py \
              --metrics-file "$$RAMBLE_ROOT/perf_test_metrics.json" \
              --project-id "$_PROJECT_ID" \
              --dataset-id "$_DATASET_ID" \
              --table-id "$_TABLE_ID" \
              --commit-sha "$COMMIT_SHA"
            
            upload_err=$$?
            if [ $$upload_err -ne 0 ]; then
              echo "Failed to upload metrics."
              exit $$upload_err
            fi
          elif [ -n "$_PR_NUMBER" ]; then
            echo "Posting metrics to PR $_PR_NUMBER..."
            # Based on https://pyjwt.readthedocs.io/en/stable/installation.html#cryptographic-dependencies-optional
            pip install pyjwt[crypto]
            python3 share/ramble/qa/post_perf_pr_comment.py \
              --metrics-file "$$RAMBLE_ROOT/perf_test_metrics.json" \
              --commit-sha "$COMMIT_SHA" \
              --project-id "$_PROJECT_ID" \
              --dataset-id "$_DATASET_ID" \
              --table-id "$_TABLE_ID" \
              --pr-number "$_PR_NUMBER" \
              --repo "Ramble-Project/ramble"
            
            post_err=$$?
            if [ $$post_err -ne 0 ]; then
              echo "Failed to post PR comment."
              exit $$post_err
            fi
          else
            echo "Skipping metric upload and PR comment."
          fi
        else
          echo "Perf tests failed."
          exit $$test_err
        fi

    id: ramble-perf-tests
    entrypoint: /bin/bash
    env:
    - 'COMMIT_SHA=$COMMIT_SHA'
    - 'PR_NUMBER=$_PR_NUMBER'
    - 'GITHUB_CLIENT_ID=$_GITHUB_CLIENT_ID'
    secretEnv: ['GITHUB_APP_PRIVATE_KEY']

substitutions:
  _SPACK_REF: 'v1.0.0'
  _PYTHON_VER: '3.13.5'
  _BASE_IMG: 'rockylinux'
  _BASE_VER: '8'
  _PROJECT_ID: ''
  _DATASET_ID: ''
  _TABLE_ID: ''
  # This is only set to true when pushing to develop branch
  _UPLOAD_TO_BQ: 'false'
  # client_id is recommended over app id.
  # client_id is not a secret.
  _GITHUB_CLIENT_ID: 'Iv23lijUJezfMNVKLbBM'
  _WORKER_POOL: ''

timeout: 3600s
queueTtl: 7200s
options:
  pool:
    name: '$_WORKER_POOL'

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/ramble-pr-bot-private-key/versions/latest
    env: 'GITHUB_APP_PRIVATE_KEY'
